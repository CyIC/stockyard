# CI for Stockyard: runs the same tox environments as local development (tox.ini).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tox:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [flake8, pylint, py313]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - run: python -m pip install --upgrade pip "tox>=4.22"
      - run: tox -e ${{ matrix.env }}
