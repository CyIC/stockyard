# Deploys Warren to DigitalOcean App Platform when a GitHub release is published:
# test -> build and push ghcr.io/cyic/stockyard:<tag> -> deploy that exact digest.
# Needs a "production" environment with secrets DIGITALOCEAN_ACCESS_TOKEN and DISCORD_TOKEN.
name: Release

on:
  release:
    types: [published]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - run: python -m pip install --upgrade pip "tox>=4.22"
      - run: tox -e flake8,pylint,py313

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/cyic/stockyard:${{ github.event.release.tag_name }}
            ghcr.io/cyic/stockyard:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.event.release.tag_name }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: digitalocean/app_action/deploy@v2
        env:
          WARREN_DIGEST: ${{ needs.build.outputs.digest }}
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
          app_spec_location: .do/app.yml
          print_build_logs: true
          print_deploy_logs: true
