name: stockyard
workers:
- name: warren
  dockerfile_path: Dockerfile
  github:
    repo: CyIC/stockyard
    branch: main
    deploy_on_push: true
  instance_count: 1
  envs:
  - key: DISCORD_TOKEN
    scope: RUN_TIME
    type: SECRET
  - key: STOCKYARD_DATA_DIR
    scope: RUN_TIME
    value: /tmp/stockyard
  - key: LOGGING_LEVEL
    scope: RUN_TIME
    value: INFO
