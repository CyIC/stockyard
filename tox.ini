[tox]
envlist = py313,flake8,pylint,security,docs
isolated_build = True
skip_missing_interpreters = True

[testenv]
# tox builds/installs the package via the poetry-core backend (isolated_build);
# only the test-runner deps are declared here.
deps =
    pytest
    pytest-cov
setenv =
    PYTHONPATH = {toxinidir}/src
    COVERAGE_FILE = {toxworkdir}/.coverage.{envname}
commands =
    pytest {posargs} \
    --cov=src/warren_bot \
    --cov-report=term-missing \
    --cov-report=xml:{toxworkdir}/coverage-{envname}.xml \
    --cov-report=html:{toxworkdir}/htmlcov-{envname} \
    --junitxml={toxworkdir}/junit-{envname}.xml \
    src/tests/
depends = clean

[testenv:clean]
description = Clean up coverage and test artifacts
deps = coverage[toml]
skip_install = true
commands =
    coverage erase
    python -c "import shutil, pathlib; [shutil.rmtree(p, ignore_errors=True) for p in pathlib.Path('{toxworkdir}').glob('htmlcov-*')]"
    python -c "import pathlib; [p.unlink(missing_ok=True) for p in pathlib.Path('{toxworkdir}').glob('coverage-*.xml')]"
    python -c "import pathlib; [p.unlink(missing_ok=True) for p in pathlib.Path('{toxworkdir}').glob('junit-*.xml')]"

[testenv:flake8]
description = Run flake8 linting
skip_install = true
deps =
    flake8>=6.0.0
    flake8-docstrings>=1.7.0
    flake8-bugbear>=23.0.0
    flake8-comprehensions>=3.14.0
    flake8-simplify>=0.20.0
    pep8-naming>=0.13.0
commands =
    flake8 src/warren_bot/ {posargs}
;commands =
;    poetry run flake8 src/warren_bot setup.py

[testenv:pylint]
description = Run pylint static analysis
skip_install = true
commands_pre = poetry install --only main
commands =
    poetry run pylint src/warren_bot/ {posargs}
;commands =
;    poetry run pylint src

[testenv:security]
description = Run security checks with bandit and safety
skip_install = true
deps =
    bandit[toml]>=1.7.0
    safety>=2.0.0
commands =
    bandit -r src/warren_bot/ -f json -o {toxworkdir}/bandit-report.json
    bandit -r src/warren_bot/
    safety check --json --output {toxworkdir}/safety-report.json
    safety check

[testenv:format]
description = Format code with black and isort
skip_install = true
deps =
    black>=23.0.0
    isort>=5.12.0
commands =
    isort src/ --check-only --diff {posargs}
    black src/ --check --diff {posargs}

[testenv:format-fix]
description = Fix code formatting with black and isort
skip_install = true
deps =
    black>=23.0.0
    isort>=5.12.0
commands =
    isort src/ {posargs}
    black src/ {posargs}

[testenv:type]
description = Run type checking with mypy
skip_install = true
deps =
    mypy>=1.5.0
    types-requests
    types-python-dateutil
commands =
    mypy src/warren_bot/ {posargs}

[testenv:coverage-report]
description = Combine coverage reports from all test runs
deps = coverage[toml]
skip_install = true
depends = py{311,312,313}
parallel_show_output = true
commands =
    coverage combine {toxworkdir}/.coverage.*
    coverage report --show-missing
    coverage html -d {toxworkdir}/htmlcov-combined
    coverage xml -o {toxworkdir}/coverage-combined.xml
    echo "Combined coverage report generated"

[testenv:all]
description = Run all quality checks
skip_install = true
depends = clean,py{311,312,313},flake8,pylint,security,type,coverage-report
commands =
    echo "All quality checks completed successfully!"

# Configuration sections
[pytest]
minversion = 7.0
pythonpath = src
testpaths =
    src/tests
python_files =
    test_*.py
    *_test.py
python_classes =
    Test*
python_functions =
    test_*
addopts =
    --strict-markers
    --strict-config
    --verbosity=2
    --tb=short
    --cov-branch
    --cov-fail-under=70
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests

[coverage:run]
source = src/warren_bot
branch = true
omit =
    src/tests/*
    src/warren_bot/__main__.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod
show_missing = true
precision = 2

[coverage:html]
directory = htmlcov

[flake8]
max-line-length = 120
max-complexity = 10
select = E,W,F,C,B,B9
extend-ignore =
    E501,  # line too long (handled by black)
    D401,  # first line should be in imperative mood
per-file-ignores =
    src/tests/*:D100,D101,D102,D103,D104,S101,S106
    src/warren_bot/__init__.py:F401
    src/warren_bot/utilities.py:W503
;	test_data_dict.py: D102,D101
;	test_utilities.py: D102,D101
;	test_report_thread.py: D102,D101
;	test_gui_handler.py: D102,D101
exclude =
    .git,
    __pycache__,
    .tox,
    .venv,
    venv,
    .eggs,
    *.egg,
    build,
    dist,
    .pytest_cache

[isort]
profile = black
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
src_paths = ["src"]
